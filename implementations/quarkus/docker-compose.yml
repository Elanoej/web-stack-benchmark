services:
  quarkus:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benchmark-quarkus
    network_mode: "host"
    cpus: ${CPUS:-2}
    mem_limit: ${MEM_LIMIT:-2G}
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/benchmark
      QUARKUS_DATASOURCE_USERNAME: bench
      QUARKUS_DATASOURCE_PASSWORD: bench123
      QUARKUS_HTTP_PORT: "5000"