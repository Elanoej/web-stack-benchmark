services:
  rust-axum:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benchmark-rust-axum
    network_mode: "host"
    cpus: ${CPUS:-2}
    mem_limit: ${MEM_LIMIT:-2G}
    environment:
      DATABASE_URL: postgres://bench:bench123@localhost:5432/benchmark?sslmode=disable
      PORT: "5000"
