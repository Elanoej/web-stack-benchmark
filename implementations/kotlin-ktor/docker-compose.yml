services:
  ktor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benchmark-kotlin-ktor
    network_mode: "host"
    cpus: ${CPUS:-2}
    mem_limit: ${MEM_LIMIT:-2G}
    environment:
      DATABASE_URL: jdbc:postgresql://localhost:5432/benchmark?user=bench&password=bench123&sslmode=disable
      PORT: "5000"
