services:
  spring-mvc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: benchmark-spring-mvc
    network_mode: "host"
    cpus: ${CPUS:-2}
    mem_limit: ${MEM_LIMIT:-2G}
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/benchmark
      SPRING_DATASOURCE_USERNAME: bench
      SPRING_DATASOURCE_PASSWORD: bench123
      SERVER_PORT: "5000"
