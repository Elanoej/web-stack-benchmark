# Infraestrutura base: postgres + nginx + pgadmin
# Uso: docker compose -f infra/docker-compose.yml --env-file ../.env up -d
# pgAdmin em http://localhost:5050 (admin@example.com / admin)
services:

  postgres:
    image: postgres:16-alpine
    container_name: benchmark-postgres
    network_mode: "host"
    environment:
      POSTGRES_DB:       benchmark
      POSTGRES_USER:     bench
      POSTGRES_PASSWORD: bench123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    command: postgres -c max_connections=30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: benchmark-nginx
    network_mode: "host"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: benchmark-pgadmin
    network_mode: "host"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 5050
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
