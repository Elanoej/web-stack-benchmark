# Infraestrutura base: postgres + nginx + pgadmin
# Uso: docker compose -f infra/docker-compose.yml --env-file ../.env up -d
services:

  postgres:
    image: postgres:16-alpine
    container_name: benchmark-postgres
    network_mode: "host"
    environment:
      POSTGRES_DB:       benchmark
      POSTGRES_USER:     bench
      POSTGRES_PASSWORD: bench123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./postgres/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    command: postgres -c max_connections=30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d benchmark"]
      interval: 5s
      timeout: 5s
      retries: 10

  nginx:
    image: nginx:alpine
    container_name: benchmark-nginx
    network_mode: "host"
    environment:
    - NGINX_WORKERS=${CPUS}
    volumes:
      - ./nginx/nginx.conf.template:/tmp/nginx.conf.template:ro
    command: >
      sh -c "envsubst '$$NGINX_WORKERS' < /tmp/nginx.conf.template
      > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"

volumes:
  postgres_data:
  pgadmin_data:
